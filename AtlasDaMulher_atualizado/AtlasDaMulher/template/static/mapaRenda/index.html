    // checkbox) means this layer should be entirely click/hover-inert -
    // not just popup-less. A background reference layer (e.g. a ward
    // boundary) is otherwise still `interactive` and can win Leaflet's
    // hit-test over a point layer sitting on top of it, since Canvas/
    // SVG resolve overlapping clicks to whichever eligible layer was
    // added to the map last (spec feedback: clicking a point kept
    // opening the boundary's popup instead). Making it non-interactive
    // removes it from hit-testing entirely, so clicks/hover pass
    // through to whatever's actually underneath.
    var layerInteractive = layerConfig.showPopup !== false;
    var layerGroup = buildStyledLayer(
      geojson, styleData, popupTrigger, layerInteractive, layerConfig.id,
      buildPopupContext(layerConfig, display),
      // A hatched polygon layer needs the SVG renderer (Canvas can't do
      // <pattern>); everything else keeps the fast shared Canvas one.
      fagStyleNeedsPattern(styleData) ? fagPatternRenderer(map) : null,
      map
    );
    FAG_LAYER_VISIBILITY.push({
      config: layerConfig, layerGroup: layerGroup, checked: !!layerConfig.defaultVisible,
    });
    // Both conditions have to hold to be on the map at load, not just
    // the checkbox: a layer whose QGIS scale-based visibility says
    // "not at this zoom" must start hidden even though it's checked.
    if (layerConfig.defaultVisible && fagLayerAllowedAtZoom(layerConfig, map.getZoom())) {
      layerGroup.addTo(map);
    }
    // v0.3.0 spec feedback: even with the population/table order fixed
    // so layersConfig is genuinely back-to-front (data_tab.py task
    // 2-4), a polygon/line layer earlier in that order could STILL win
    // click hit-tests over a point layer listed later/in-front - traced
    // to Leaflet's Canvas renderer resolving _onClick by walking its
    // OWN internal paint-order linked list (_drawFirst/.next), which
    // does NOT reliably match layersConfig's addTo() call order once
    // circleMarkers and Polygons/Polylines are mixed (verified via a
    // 7-layer repro: circleMarkers ended up grouped ahead of BOTH
    // polygons in that list regardless of where the polygons sat in
    // layersConfig). bringToFront() explicitly re-appends a layer's
    // Path children to the end of that same linked list, so calling it
    // here - once per layer, in layersConfig's already-correct
    // back-to-front order - makes it the authoritative click-priority
    // order instead of leaving it to Leaflet's internal registration
    // order. No-ops safely for a not-yet-visible (defaultVisible:false)
    // layer (bringToFront checks the layer actually has a renderer).
    bringLayerToFront(layerGroup);

    var node = tree;
    (layerConfig.groupPath || []).forEach(function (groupName) {
      if (!node.children[groupName]) {
        node.children[groupName] = { children: {}, order: [] };
        node.order.push({ type: 'group', name: groupName });
      }
      node = node.children[groupName];
    });
    node.order.push({
      type: 'item',
      item: {
        config: layerConfig,
        layerGroup: layerGroup,
        style: styleData.defaultStyle || {},
        categoryLegend: styleData.categoryLegend || null,
      },
    });
  }

  function finish() {
    // Map-unit stroke widths (real-world meters, see style-renderer.js's
    // FAG_MAPUNIT_PATHS): resolve them to px for the initial zoom now
    // that every layer is built, then keep them tracking the zoom level
    // so zooming out shrinks them exactly like QGIS's マップ単位 widths
    // (instead of a constant screen thickness swallowing the whole map).
    if (FAG_MAPUNIT_PATHS.length) {
      fagUpdateMapUnitWeights(map);
      map.on('zoomend', function () { fagUpdateMapUnitWeights(map); });
    }

    renderLayerTree(tree, listEl, map);
    refreshGroupCheckboxStates();

    // Zoom-driven layer visibility (item 6-A) and point thinning
    // (item 6-B). Both are re-evaluated on zoomend only: the thinning
    // grid is measured in degrees at the current zoom, so panning
    // can't change the outcome and running on moveend would be pure
    // cost. Wired only when something actually uses them.
    var needsZoomVisibility = layersConfig.some(function (layerConfig) {
      return (layerConfig.minZoom !== undefined && layerConfig.minZoom !== null) ||
        (layerConfig.maxZoom !== undefined && layerConfig.maxZoom !== null);
    });
    var thinning = display.thinning || null;
    if (needsZoomVisibility || thinning) {
      map.on('zoomend', function () {
        if (needsZoomVisibility) fagApplyLayerVisibility(map);
        if (thinning) fagApplyThinning(map, thinning);
      });
      if (thinning) fagApplyThinning(map, thinning);
    }

    fagRemoveLoadingOverlay();
    onComplete();
  }

  // One layer per event-loop turn: the counter in #loading-overlay only
  // means anything if the browser gets a chance to paint between
  // layers, and on a large export each layer is a long enough block of
  // work that the difference is very visible. The 0ms timeout is not a
  // delay - it's the yield.
  var index = 0;
  fagSetLoadingProgress(0, layersConfig.length);
  (function step() {
    if (index >= layersConfig.length) {
      finish();
      return;
    }
    buildOne(layersConfig[index]);
    index += 1;
    fagSetLoadingProgress(index, layersConfig.length);
    setTimeout(step, 0);
  })();
}

/* Recursively brings every Path child (circleMarker/polygon/polyline -
   the things that actually participate in Canvas's click hit-test
   order) to the front of the shared canvas's paint order. Point
   markers are LayerGroups of two circleMarkers (visual + invisible hit
   target - see createStyledMarker), reached via .eachLayer; a non-
   circle marker (divIcon L.marker) has neither .eachLayer nor
   .bringToFront and is silently skipped - it doesn't need this, since
   plain DOM markers already click-prioritize correctly via normal DOM
   stacking (later-added = later in markerPane = on top), a completely
   separate mechanism from the shared canvas. */
function bringLayerToFront(layer) {
  if (layer.eachLayer) {
    layer.eachLayer(bringLayerToFront);
    return;
  }
  if (layer.bringToFront) layer.bringToFront();
}

// {checkbox, leaves: [...leaf <input> elements]} for every group
// header rendered so far, refreshed together (checked/indeterminate)
// whenever any leaf layer checkbox changes - see refreshGroupCheckboxStates.
var FAG_GROUP_CHECKBOXES = [];
var fagGroupIdSeq = 0;

function refreshGroupCheckboxStates() {
  FAG_GROUP_CHECKBOXES.forEach(function (entry) {
    var total = entry.leaves.length;
    var checkedCount = entry.leaves.filter(function (cb) { return cb.checked; }).length;
    entry.checkbox.checked = total > 0 && checkedCount === total;
    entry.checkbox.indeterminate = checkedCount > 0 && checkedCount < total;
  });
}

/* Renders one tree level and returns every leaf layer <input> checkbox
   under it (including ones nested in sub-groups), so a group header's
   own checkbox can toggle - and its checked/indeterminate state can
   reflect - all of its descendants, not just its direct children.

   node.order is walked in reverse: node.order[last] was added to the
   map LAST (drawn on top of its siblings), so listing it FIRST here
   makes "top of this panel" mean "top of the map" - same convention
   data_tab.py uses for its own table. Groups and items share this one
   reversal (spec feedback: keeping group order untouched while only
   reversing sibling items split them into "every group, then every
   item" and could put a group's header out of place relative to
   siblings it's actually interleaved with in the QGIS layer tree). */
function renderLayerTree(node, containerEl, map) {
  var leafCheckboxes = [];

  node.order.slice().reverse().forEach(function (entry) {
    if (entry.type === 'group') {
      var groupName = entry.name;
      var child = node.children[groupName];
      var groupLi = document.createElement('li');
      groupLi.className = 'fag-layer-group';

      var groupCheckboxId = 'layer-group-toggle-' + (fagGroupIdSeq++);
      var header = document.createElement('div');
      header.className = 'fag-layer-group-header';
      header.innerHTML = '<input type="checkbox" id="' + groupCheckboxId + '" checked>' +
        '<label for="' + groupCheckboxId + '" class="fag-layer-group-title"></label>';
      header.querySelector('label').textContent = groupName;
      groupLi.appendChild(header);

      var subUl = document.createElement('ul');
      subUl.className = 'fag-layer-sublist';
      groupLi.appendChild(subUl);

      containerEl.appendChild(groupLi);

      var groupLeaves = renderLayerTree(child, subUl, map);
      var groupCheckbox = header.querySelector('input');
      groupCheckbox.addEventListener('change', function (e) {
        var checked = e.target.checked;
        groupLeaves.forEach(function (cb) {
          if (cb.checked !== checked) {
            cb.checked = checked;
            cb.dispatchEvent(new Event('change'));
          }
        });
      });
      FAG_GROUP_CHECKBOXES.push({ checkbox: groupCheckbox, leaves: groupLeaves });
      leafCheckboxes = leafCheckboxes.concat(groupLeaves);
    } else {
      var item = entry.item;
      var layerConfig = item.config;
      var layerGroup = item.layerGroup;
      var checkboxId = 'layer-toggle-' + layerConfig.id;
      var li = document.createElement('li');
      li.className = 'fag-layer-item';
      // Checkbox + swatch + name share one flex row; a categorized
      // layer's category list becomes a sibling BELOW that row, so a
      // long layer name wrapping can't push the checkbox out of line.
      var itemRow = document.createElement('div');
      itemRow.className = 'fag-layer-item-row';
      itemRow.innerHTML = '<input type="checkbox" id="' + checkboxId + '"' +
        (layerConfig.defaultVisible ? ' checked' : '') + '>' +
        buildLegendSwatchHtml(item.style) +
        '<label for="' + checkboxId + '"></label>';
      itemRow.querySelector('label').textContent = layerConfig.label;
      li.appendChild(itemRow);
      // A categorized layer lists each of its categories underneath,
      // so the panel matches what QGIS's own legend shows for it.
      var categoryList = buildCategoryLegendHtml(item.categoryLegend);
      if (categoryList) li.appendChild(categoryList);
      var checkbox = itemRow.querySelector('input');
      checkbox.addEventListener('change', function (e) {
        // Record the user's intent, then let fagApplyLayerVisibility
        // reconcile it with the layer's zoom range - checking a layer
        // that's outside its zoom range must not force it onto the map
        // (spec item 6-A).
        var record = null;
        FAG_LAYER_VISIBILITY.forEach(function (candidate) {
          if (candidate.layerGroup === layerGroup) record = candidate;
        });
        if (record) {
          record.checked = e.target.checked;
          fagApplyLayerVisibility(map);
        } else if (e.target.checked) {
          layerGroup.addTo(map);
        } else {
          map.removeLayer(layerGroup);
        }
        refreshGroupCheckboxStates();
      });
      containerEl.appendChild(li);
      leafCheckboxes.push(checkbox);
    }
  });

  return leafCheckboxes;
}

/* Small swatch shown next to each layer's toggle checkbox so the
   panel doubles as a legend (spec feedback: previously just a
   checkbox + name, with no hint of what the layer actually looks
   like on the map). Uses the layer's defaultStyle only - a
   categorized layer's per-category colors aren't broken out here,
   just its fallback style. */
/* A fully opaque swatch background would misrepresent a semi-transparent
   fill, and would show a solid block for an outline-only polygon
   (fillOpacity 0) as if it had a real fill - so the swatch's background
   must carry the same opacity the map itself uses, not just its color. */
function hexToRgba(hex, opacity) {
  if (!hex) return 'transparent';
  var h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
  var r = parseInt(h.substring(0, 2), 16);
  var g = parseInt(h.substring(2, 4), 16);
  var b = parseInt(h.substring(4, 6), 16);
  var a = (opacity === undefined || opacity === null) ? 1 : opacity;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function buildLegendSwatchHtml(style) {
  if (!style) return '';
  if (style.marker) {
    var m = style.marker;
    var shape = m.shape || 'circle';
    var bg = hexToRgba(m.color, m.opacity);
    if (shape === 'circle' || shape === 'square') {
      // Same fill/stroke opacity split the map itself uses, so a
      // see-through marker reads as see-through in the legend too.
      var strokeColor = hexToRgba(m.strokeColor || m.color, m.strokeOpacity);
      var strokeWidth = (m.strokeWidth === undefined || m.strokeWidth === null) ? 1 : m.strokeWidth;
      var shapeClass = shape === 'circle' ? 'fag-legend-circle' : 'fag-legend-box';
      return '<span class="fag-legend-swatch ' + shapeClass + '" style="background:' + bg +
        ';border:' + strokeWidth + 'px solid ' + strokeColor + ';"></span>';
    }
    // Clipped/rotated shapes (star/cross/triangle/diamond) mirror the
    // map's own divIcon rendering, which is borderless fill-only - a
    // border would get unevenly cut off by the clip-path anyway. The
    // shape vocabulary here matches SHAPE_NAME_MAP on the Python side
    // (style_extractor.py), so each has a .fag-legend-<shape> rule.
    return '<span class="fag-legend-swatch fag-legend-' + shape + '" style="background:' + bg + ';"></span>';
  }
  if (style.line) {
    return '<span class="fag-legend-swatch fag-legend-line" style="background:' +
      hexToRgba(style.line.color, style.line.opacity) + ';"></span>';
  }
  if (style.fill) {
    var f = style.fill;
    // A hatched fill gets an inline-SVG swatch carrying its own copy of
    // the pattern, so the legend and the map agree (spec item 10:
    // "凡例のスウォッチにも同じパターンを描かないと地図と食い違う").
    var patternSwatch = f.fillPattern ? fagPatternSwatchHtml(f) : null;
    if (patternSwatch) return patternSwatch;
    var fillBg = (f.hasFill === false) ? 'transparent' : hexToRgba(f.fillColor, f.fillOpacity);
    var border = (f.hasStroke === false || !f.strokeWidth)
      ? '0'
      : Math.min(f.strokeWidth, 3) + 'px solid ' + hexToRgba(f.strokeColor, f.strokeOpacity);
    return '<span class="fag-legend-swatch fag-legend-box" style="background:' + fillBg +
      ';border:' + border + ';"></span>';
  }
  if (style.tile) {
    return '<span class="fag-legend-swatch fag-legend-tile"></span>';
  }
  return '';
}

/* Per-category legend rows for a layer using a QGIS categorized
   renderer (spec item 3: "凡例もカテゴリ単位で出力する"). Without
   this the panel showed one swatch per LAYER - for a layer whose whole
   point is that it's colored by 施設種別 or 活用方針, that single
   swatch is one arbitrary category's color and tells the reader
   nothing. `label` is QGIS's own legend text for the category, which
   is often not the raw value ("1" -> "小学校"). Uses the same
   buildLegendSwatchHtml as the layer rows, so a categorized polygon's
   entries show the same transparency/outline treatment as everything
   else. */
function buildCategoryLegendHtml(categoryLegend) {
  if (!categoryLegend || !categoryLegend.entries || !categoryLegend.entries.length) return null;
  var ul = document.createElement('ul');
  ul.className = 'fag-legend-categories';
  categoryLegend.entries.forEach(function (entry) {
    var li = document.createElement('li');
    li.innerHTML = buildLegendSwatchHtml(entry.style) + '<span></span>';
    // A category can legitimately have a blank legend label in QGIS -
    // most often the "all other values" catch-all, which QGIS leaves
    // unnamed. Rendering that as a bare swatch with no text next to it
    // reads as a bug, so fall back to the raw classification value and
    // finally to an explicit placeholder.
    var text = entry.label || entry.value || '(other)';
    // textContent, not innerHTML - a category label is raw QGIS data and
    // can contain <, & or quotes.
    li.querySelector('span:last-child').textContent = text;
    ul.appendChild(li);
  });
  return ul;
}

/* For a categorized-renderer layer (spec 4.2.2/4.2.3), pick the
   per-category sub-style (marker/line/fill[+label]) matching this
   feature's classification field value; null if there's no byCategory
   table or the value doesn't match any category (caller then falls
   back to defaultStyle - the same outcome QGIS gives an unmatched
   value that isn't covered by an "all other values" catch-all). */
function resolveCategoryStyle(byCategory, props) {
  if (!byCategory) return null;
  var field = Object.keys(byCategory)[0];
  if (!field) return null;
  var table = byCategory[field];
  var raw = props ? props[field] : undefined;
  var key = (raw === null || raw === undefined) ? '' : String(raw);
  return Object.prototype.hasOwnProperty.call(table, key) ? table[key] : null;
}

/* When multiple point features sit at the exact same coordinate (or a
   QGIS-precision-identical one - geojson_writer.py already rounds to 6
   decimals, so two truly co-located source points end up byte-identical
   here), their circleMarkers/hit-targets stack exactly on top of each
   other: only the topmost color is visible, its label overlaps the
   others illegibly (label-declutter.js then hides one, since both
   permanent tooltips anchor at the same screen position), and a click
   can hit whichever one happens to be on top in DOM order - not
   necessarily the one that's visually showing (spec feedback: point
   color/label/popup didn't match at a shared coordinate). This must
   run across *every* marker layer together, not one layer at a time:
   two facilities can be split across separate legend layers (e.g.
   filtered from one shared dataset into 事業予定地/処分検討地/継続保有地
   by their 活用方針 value) and still share a coordinate - a per-layer
   check would never see that, since each layer's own GeoJSON only has
   one of the two points. Spreading every exact-duplicate group into a
   small ring (a fixed real-world radius, not a screen-pixel one -
   simple and avoids pulling in a clustering library) gives each point
   its own position, so color/label/popup all correspond to the same
   dot again regardless of which layer(s) they came from. Mutates the
   layersData features in place, once, before any layer is built. */
function spreadOverlappingPointsAcrossLayers(layersConfig, layersData, layersStyleData) {
  var groups = {};
  layersConfig.forEach(function (layerConfig) {
    var styleData = layersStyleData[layerConfig.id] || {};
    if (!(styleData.defaultStyle && styleData.defaultStyle.marker)) return; // point/marker layers only
    var geojson = layersData[layerConfig.id];
    if (!geojson || !geojson.features) return;
    geojson.features.forEach(function (feature) {
      if (!feature.geometry || feature.geometry.type !== 'Point') return;
      var coords = feature.geometry.coordinates;
      var key = coords[0].toFixed(6) + ',' + coords[1].toFixed(6);
      (groups[key] = groups[key] || []).push(feature);
    });
  });
  Object.keys(groups).forEach(function (key) {
    var group = groups[key];
    if (group.length < 2) return;
    var lng0 = group[0].geometry.coordinates[0];
    var lat0 = group[0].geometry.coordinates[1];
    var n = group.length;
    // Grows a little with group size so 5-6 stacked features still end
    // up with visibly separate dots, not just a slightly-fatter ring.
    var radiusMeters = 3 + Math.min(n, 8) * 0.6;
    var latRad = (lat0 * Math.PI) / 180;
    var lngScale = Math.cos(latRad) || 1;
    group.forEach(function (feature, i) {
      var angle = (2 * Math.PI * i) / n;
      var dLat = (radiusMeters * Math.sin(angle)) / 111320;
      var dLng = (radiusMeters * Math.cos(angle)) / (111320 * lngScale);
      feature.geometry.coordinates = [lng0 + dLng, lat0 + dLat];
      // Flags this feature for pointToLayer below - only spread-apart
      // points are close enough together that label-declutter.js needs

  // Labels/legend still show as normal - only click/hover interactivity
  // (popup, hover highlight, and being hit-tested at all) is disabled,
  // which is also how a background reference layer is kept from
  // stealing clicks meant for a layer on top of it (see
  // initLayerControl's layerInteractive and the `fill` comment below
  // for the same idea applied to just fillOpacity:0 polygons).

    // 国土地理院 basemap), published as-is rather than styled GeoJSON.

    // QGIS transparency or the plugin's per-layer override - see

    //   maxNativeZoom - the deepest zoom real tiles exist for; beyond

    // map's own limit so the layer is never hidden inside the zoom

    // layers, in initLayerControl - see spreadOverlappingPointsAcrossLayers.

        // a road drawn at its actual width). The px weight for it is
        // zoom-dependent, recomputed by fagUpdateMapUnitWeights -
        // initLayerControl runs it once after all layers are built
        // (before that this feature keeps the fallback px width from

        var resolved = resolveCategoryStyle(byCategory, (feature && feature.properties) || {});
        var lineStyle = (resolved && resolved.line) || style.line;

    return L.geoJSON(geojson, {
      style: function (feature) {

          // or near it (spec feedback: clicking near points kept

          // being false removes it from hit-testing entirely (including
          // its stroke) - the stronger, opt-in version of this same fix.

/* Skips binding a popup entirely when every attribute is hidden (all
   fields unchecked in the plugin's per-layer field picker) - an empty
   `<div class="fag-popup"></div>` box popping up on click reads as a
   bug ("何も出ない"), so absent any content there should be no popup
   at all. `popupTrigger === 'hover'` (表示設定 tab) additionally opens

   clicking, it just adds an extra way in. */

    props,
    popupCtx,
    fagFeatureLatLng(layer)

    layer.bindPopup(html);
  }

  if (popupTrigger === 'hover') {

    var salarios = props["Salários"];

    if (salarios !== null && salarios !== undefined && salarios !== '') {

      layer.bindTooltip(
        String(salarios),
        {
          sticky: false,
          direction: 'top',
          permanent: false

      );

    }
  }
}


/* ---- label-layer.js ---- */
/* Canvas-based label layer (v0.3.0 task 1-1/1-2, replaces the old
   label-declutter.js DOM-tooltip approach).

   Why not permanent Leaflet tooltips: every permanent tooltip is its
   own DOM node that Leaflet repositions synchronously inside setZoom.
   Profiled against a synthetic 1,530-point dataset that made every
   single zoom step block for ~1.0-1.2 *seconds*; unbinding all
   tooltips dropped the same steps to 10-40ms. So at the 1,000+ point
   scale this app targets, labels can't live in the DOM at all - this
   draws every visible label onto ONE <canvas> in a dedicated map pane
   instead, and a full redraw (placement + text with halo) costs a few
   ms because text metrics come from ctx.measureText (pure math, no
   layout) and are cached per label.

   Collision handling (task 1-2 - show labels earlier when zoomed out):
   labels are placed greedily in registration order, but the collision
   test uses each label's box shrunk toward its own center
   (FAG_LABEL_COLLISION_INSET_X/Y), so two labels may partially overlap
   before one gets hidden. The spec explicitly prefers "visible early,
   somewhat overlapping" over strict collision avoidance. Hidden labels
   aren't gone - the pass reruns on every view change, so they appear
   as soon as zooming in gives them room.

   Markers flagged `fagLabelMultiDirection` (exact-duplicate-coordinate
   points spread apart by layer-control.js) additionally try
   right/left/below placements before giving up, reusing the same
   cached text metrics - no extra measurement per direction.

   Placements kept by the latest pass are published in
   FAG_LABEL_PLACEMENTS ({entry, marker, rect} - rect in container-
   pixel coords) so initLabelClickPopup below can hit-test clicks
   against them and open the right marker's popup (task 2-1). */

/* Fraction of a label's width/height trimmed from EACH side of its box
   before collision testing - bigger values let labels overlap more
   before one is hidden (0 restores strict non-overlap). */
var FAG_LABEL_COLLISION_INSET_X = 0.2;
var FAG_LABEL_COLLISION_INSET_Y = 0.25;

var FAG_LABEL_PLACEMENTS = [];

// v0.3.0 UX request: an on/off button on the map itself for all
// labels at once (independent of the per-layer checkboxes in
// #layer-panel, which only ever hide/show a layer's markers - the
// label canvas is shared across every layer, so this is a single flag
// rather than something layer-control.js could toggle per layer).
var FAG_LABELS_ENABLED = true;

/* Map-unit label sizes (QGIS マップ単位/メートル(地図単位) font size -
   the label is meant to cover a real-world size, e.g. text sized to
   the building it names, so it grows and shrinks with the zoom instead
   of staying a constant screen size). style_extractor exports those as
   `fontSizeMeters` / `buffer.widthMeters`; everything else keeps the
   fixed px `fontSize` / `buffer.width`.

   The px floor keeps a zoomed-out label readable rather than letting it
   collapse into an illegible smudge (the equivalent of the 0.5px
   hairline floor map-unit line weights use); the ceiling only guards
   against a single label swallowing the viewport when zoomed far in. */
var FAG_LABEL_MIN_PX = 6;
var FAG_LABEL_MAX_PX = 200;

function fagLabelFontSize(map, labelStyle) {
  if (labelStyle && labelStyle.fontSizeMeters) {
    var px = fagMetersToPixels(map, labelStyle.fontSizeMeters);
    // Rounded so panning/zoom jitter can't invalidate the cached text
    // metrics (see computeLabelPlacements) on every single frame.
    return Math.round(Math.max(FAG_LABEL_MIN_PX, Math.min(FAG_LABEL_MAX_PX, px)));
  }
  return (labelStyle && labelStyle.fontSize) || 12;
}

function fagLabelBufferWidth(map, labelStyle) {
  var buffer = labelStyle && labelStyle.buffer;
  if (!buffer) return 0;
  if (buffer.widthMeters) {
    // Same tight cap style_extractor applies to px halos: hundreds of
    // dense labels with big halos merge into one opaque block.
    return Math.min(4, fagMetersToPixels(map, buffer.widthMeters));
  }
  return buffer.width || 0;
}

function initLabelLayer(map) {
  var pane = map.createPane('fag-labels');
  // Above markerPane (600) so labels overlay markers, below popupPane
  // (700) so an open popup still covers nearby labels.
  pane.style.zIndex = 650;
  pane.style.pointerEvents = 'none';

  var canvas = document.createElement('canvas');
  pane.appendChild(canvas);
  var ctx = canvas.getContext('2d');

  var scheduled = false;
  function run() {
    scheduled = false;
    redrawLabels(map, canvas, ctx);
  }
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(run);
  }
  // layeradd/layerremove fire once per child marker when a whole layer
  // group is toggled - the rAF gate above coalesces that burst into a
  // single redraw.
  map.on('zoomend moveend resize layeradd layerremove', schedule);
  schedule();

  addLabelToggleControl(map, schedule);
}

function redrawLabels(map, canvas, ctx) {
  var size = map.getSize();
  var dpr = window.devicePixelRatio || 1;
  if (canvas.width !== size.x * dpr || canvas.height !== size.y * dpr) {
    canvas.width = size.x * dpr;
    canvas.height = size.y * dpr;
    canvas.style.width = size.x + 'px';
    canvas.style.height = size.y + 'px';
  }
  // The canvas lives in a map pane, which Leaflet translates while
  // panning - pinning it to the viewport's current top-left layer
  // point keeps it covering the screen (same trick Leaflet's own
  // canvas renderer uses); labels drift with the map mid-drag and
  // snap to the refreshed layout on moveend.
  L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0, 0]));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size.x, size.y);

  // Labels toggled off: leave the canvas cleared and no placements
  // registered (so a click can't hit a label that isn't drawn - see
  // initLabelClickPopup below) rather than skipping the resize/
  // position update above, which still needs to happen so the canvas
  // is correctly sized/placed the moment labels are turned back on.
  if (!FAG_LABELS_ENABLED) {
    FAG_LABEL_PLACEMENTS = [];
    return;
  }

  var placements = computeLabelPlacements(map, size);
  FAG_LABEL_PLACEMENTS = placements;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';

    var m = p.entry.metrics;
    var labelStyle = p.entry.labelStyle || {};

    ctx.font = m.font;
    var cx = p.rect.left + m.width / 2;
    for (var i = 0; i < m.lines.length; i++) {

        ctx.lineWidth = bufferWidth * 2;

function computeLabelPlacements(map, size) {
  var kept = [];
  var keptTestRects = [];
  // Slight bounds padding so a label whose text sticks into the view
  // from a just-offscreen marker still gets drawn.
  var viewBounds = map.getBounds().pad(0.1);

  FAG_LABEL_REGISTRY.forEach(function (entry) {
    var marker = entry.marker;
    if (!marker._map) return; // layer currently toggled off
    var latlng = marker.getLatLng();
    if (!viewBounds.contains(latlng)) return;

    // Fixed-px labels measure once and hit the cache forever after; a
    // map-unit label re-measures only when its rounded px size actually
    // changes (i.e. on a zoom step, not on every pan frame).
    var fontSize = fagLabelFontSize(map, entry.labelStyle);
    var m = entry.metrics;
    if (!m || entry.metricsFontSize !== fontSize) {
      m = entry.metrics = measureLabelText(entry, fontSize);
      entry.metricsFontSize = fontSize;
    }
    if (!m.lines.length) return;

    var pt = map.latLngToContainerPoint(latlng);
    // Default placement: centered above the marker (same anchor the
    // old tooltip version used).
    var baseLeft = pt.x - m.width / 2;
    var baseTop = pt.y - entry.anchorGap - m.height;

    var candidates = [{ dx: 0, dy: 0 }];
    if (marker.fagLabelMultiDirection) {
      var dx = m.width * 0.85 + 6;
      var dy = m.height * 1.3 + 4;
      candidates.push({ dx: dx, dy: 0 }, { dx: -dx, dy: 0 }, { dx: 0, dy: dy });
    }

    for (var i = 0; i < candidates.length; i++) {
      var off = candidates[i];
      var rect = {
        left: baseLeft + off.dx, right: baseLeft + m.width + off.dx,
        top: baseTop + off.dy, bottom: baseTop + m.height + off.dy,
      };

      if (rect.right < 0 || rect.left > size.x || rect.bottom < 0 || rect.top > size.y) continue;

      var insetX = m.width * FAG_LABEL_COLLISION_INSET_X;
      var insetY = m.height * FAG_LABEL_COLLISION_INSET_Y;
      var test = {
        left: rect.left + insetX, right: rect.right - insetX,
        top: rect.top + insetY, bottom: rect.bottom - insetY,
      };

      var overlaps = keptTestRects.some(function (other) {
        return !(test.right < other.left || test.left > other.right ||
          test.bottom < other.top || test.top > other.bottom);
      });

      if (!overlaps) {
        kept.push({ entry: entry, marker: marker, rect: rect });
        keptTestRects.push(test);
        break;
      }
    }
  });

  return kept;
}

/* Measures the label's text block at `fontSize` px. The text never
   changes after load and the size only changes for map-unit labels on
   a zoom step, so the caller caches the result on the registry entry
   alongside the size it was measured at. Shares one detached canvas
   context - measureText does no DOM layout, unlike the
   getBoundingClientRect calls the old tooltip version needed. */
var FAG_MEASURE_CTX = null;

function measureLabelText(entry, fontSize) {
  if (!FAG_MEASURE_CTX) {
    FAG_MEASURE_CTX = document.createElement('canvas').getContext('2d');
  }
  var labelStyle = entry.labelStyle || {};
  fontSize = fontSize || 12;
  var family = labelStyle.fontFamily
    ? '"' + labelStyle.fontFamily + '", "Noto Sans JP", sans-serif'
    : '"Noto Sans JP", sans-serif';
  var font = (labelStyle.bold ? '700 ' : '') + fontSize + 'px ' + family;
  // Explicit \n from QGIS wordwrap()/expressions makes a multi-line
  // label; there's no auto-wrapping (matches the old white-space: pre
  // behavior - CJK text would otherwise wrap at every character).
  var lines = String(entry.text).split('\n').filter(function (line, i, arr) {
    return line !== '' || i < arr.length - 1; // drop a trailing empty line only
  });
  FAG_MEASURE_CTX.font = font;
  var width = 0;
  lines.forEach(function (line) {
    width = Math.max(width, FAG_MEASURE_CTX.measureText(line).width);
  });
  var lineHeight = Math.round(fontSize * 1.2);
  return {
    font: font,
    lines: lines,
    width: Math.ceil(width),
    height: lines.length * lineHeight,
    lineHeight: lineHeight,

}

/* v0.3.0 task 2-1: clicking a label's TEXT (not just the marker under
   it) opens the same popup. The label canvas has pointer-events:none
   (deliberately - see initLabelLayer - so clicks pass through to
   whatever marker/shape sits underneath), so it never receives its
   own click event; instead this hit-tests the map's click point
   against the latest FAG_LABEL_PLACEMENTS.

   Must not steal a popup a directly-clicked feature already opened
   via its own click handler - Leaflet fires a layer's own 'click'
   (and any popup it opens, via bindPopup's internal click listener)
   BEFORE the map's own 'click' listeners run (its simulated event
   bubbling: layer first, then map). So tracking whether 'popupopen'
   already fired earlier in this same click's dispatch is enough to
   tell "the click was actually on a feature" apart from "the click
   only hit a label drawn over empty space" - no marker hit-testing of
   our own is needed for that half of the decision. */
function initLabelClickPopup(map) {
  var popupOpenedThisClick = false;
  map.on('popupopen', function () { popupOpenedThisClick = true; });
  map.on('click', function (e) {
    var openedByFeature = popupOpenedThisClick;
    popupOpenedThisClick = false;
    if (openedByFeature) return;
    var hit = hitTestLabelPlacement(e.containerPoint);
    if (hit && hit.marker.openPopup) hit.marker.openPopup();
  });
}

function hitTestLabelPlacement(containerPoint) {
  for (var i = 0; i < FAG_LABEL_PLACEMENTS.length; i++) {
    var r = FAG_LABEL_PLACEMENTS[i].rect;
    if (containerPoint.x >= r.left && containerPoint.x <= r.right &&
      containerPoint.y >= r.top && containerPoint.y <= r.bottom) {
      return FAG_LABEL_PLACEMENTS[i];
    }
  }
  return null;
}


/* ---- search.js ---- */
/* Cross-layer text search (v0.3.0 task 3-1), lives inside #app-header
   next to the title. Reuses whichever attributes are already visible
   in each layer's ポップアップ項目 picker (ui/field_dialog.py) rather
   than adding a separate field picker for search -
   core/geojson_writer.py never writes hidden fields to the GeoJSON in
   the first place, so Object.keys(properties) already *is* "the
   fields configured as visible" for that layer.

   Matches only features whose OWNING LAYER IS CURRENTLY VISIBLE ON THE
   MAP (checked in #layer-panel) - a result for a hidden layer would
   zoom there but the facility wouldn't actually be on the map, which
   reads as broken. point-list.js's feature table is the opposite
   choice on purpose (any layer, visible or not) since a table has no
   equivalent "found something invisible" confusion.

   Also excludes layers with showPopup === false (データ設定 tab's
   per-layer "ポップアップ表示" checkbox, same layerInteractive flag
   layer-control.js uses to make a layer click/hover-inert): selecting
   a search result normally opens that feature's popup via
   focusFeature(), so surfacing a facility whose layer can never show
   one would zoom the map for no visible result. point-list.js applies
   the same restriction to the feature table for the same reason (a row
   click there does nothing on a non-interactive layer). */
function initSearch(config, map) {
  if (!config.display || !config.display.searchEnabled) return;

  var panel = document.getElementById('search-panel');
  var input = document.getElementById('search-input');
  var dropdown = document.getElementById('search-dropdown');
  var countEl = document.getElementById('search-count');
  var resultsEl = document.getElementById('search-results');
  if (!panel || !input || !resultsEl) return;

  var searchableLayers = (config.layers || []).filter(function (layerConfig) {
    return !!FAG_FEATURES_BY_LAYER[layerConfig.id] && layerConfig.showPopup !== false;
  });
  if (!searchableLayers.length) return; // nothing with attributes to search (e.g. tile-only project)

  panel.classList.remove('fag-hidden');

  var RESULT_LIMIT = 50;
  var DEBOUNCE_MS = 120;
  var debounceTimer = null;

  input.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, DEBOUNCE_MS);
  });

  function runSearch() {
    var keyword = input.value.trim().toLowerCase();
    if (!keyword) {
      renderResults([]);
      countEl.classList.add('fag-hidden');
      dropdown.classList.add('fag-hidden');
      return;
    }
    renderResults(findMatches(keyword));
    countEl.classList.remove('fag-hidden');
    dropdown.classList.remove('fag-hidden');
  }

  function findMatches(keyword) {
    var matches = [];
    searchableLayers.forEach(function (layerConfig) {
      var byFid = FAG_FEATURES_BY_LAYER[layerConfig.id];
      Object.keys(byFid).forEach(function (fid) {
        var entry = byFid[fid];
        if (!entry.layer._map) return; // layer currently unchecked in #layer-panel
        if (featureMatches(entry.feature.properties, keyword)) {
          matches.push({ layerConfig: layerConfig, entry: entry });
        }
      });
    });
    return matches;
  }

  function featureMatches(props, keyword) {
    props = props || {};
    for (var key in props) {
      if (key === 'label_text' || key === '_fid') continue;
      var value = props[key];
      if (value !== undefined && value !== null &&
        String(value).toLowerCase().indexOf(keyword) !== -1) {
        return true;
      }
    }
    return false;
  }

  function renderResults(matches) {
    countEl.textContent = matches.length + ' result' + (matches.length === 1 ? '' : 's');
    resultsEl.innerHTML = '';
    resultsEl.classList.toggle('fag-hidden', matches.length === 0);
    if (!matches.length) return;

    var fragment = document.createDocumentFragment();
    matches.slice(0, RESULT_LIMIT).forEach(function (match) {
      fragment.appendChild(buildResultItem(match));
    });
    if (matches.length > RESULT_LIMIT) {
      var more = document.createElement('li');
      more.className = 'fag-search-more';
      more.textContent = (matches.length - RESULT_LIMIT) + ' more - narrow your search to see them';
      fragment.appendChild(more);
    }
    resultsEl.appendChild(fragment);
  }

  function buildResultItem(match) {
    var props = match.entry.feature.properties || {};
    var keys = Object.keys(props).filter(function (k) { return k !== 'label_text' && k !== '_fid'; });
    var name = props.label_text || (keys.length ? props[keys[0]] : '') || '(no name)';
    var sub = keys
      .filter(function (k) { return String(props[k]) !== String(name); })
      .map(function (k) { return props[k]; })
      .filter(function (v) { return v !== undefined && v !== null && v !== ''; })
      .slice(0, 2)
      .join(' / ');

    var li = document.createElement('li');
    li.className = 'fag-search-result';
    li.innerHTML = '<div class="fag-search-result-name"></div><div class="fag-search-result-sub"></div>';
    li.querySelector('.fag-search-result-name').textContent = name;
    li.querySelector('.fag-search-result-sub').textContent =
      match.layerConfig.label + (sub ? ' · ' + sub : '');
    li.addEventListener('click', function () {
      focusFeature(map, match.layerConfig.id, match.entry);
      dropdown.classList.add('fag-hidden');
    });
    return li;
  }

  // Now that the dropdown floats below the header instead of being
  // its own always-visible map panel, it needs to close itself when
  // the user clicks anywhere else (the map, another panel) - a click
  // on the input itself re-opens it via runSearch if there's already
  // a keyword.
  document.addEventListener('click', function (e) {
    if (!panel.contains(e.target)) dropdown.classList.add('fag-hidden');
  });
  input.addEventListener('focus', function () {
    if (input.value.trim()) dropdown.classList.remove('fag-hidden');
  });
}


/* ---- point-list.js ---- */
/* Per-layer feature attribute table (v0.3.0 task 3-2). Reuses
   whichever fields are visible in each layer's ポップアップ項目
   picker as the table's columns - same reasoning as search.js:
   core/geojson_writer.py never writes a hidden field to the GeoJSON at
   all, so Object.keys(feature.properties) already *is* "the fields
   configured as visible" for that layer, with no separate column
   picker needed here.

   Rendering is virtualized by hand (only the rows currently scrolled
   into view actually exist in the DOM) rather than laying out one
   <div> per feature up front - label-layer.js's canvas rewrite hit
   exactly this same wall at real-dataset scale (1,530 permanent
   DOM tooltips made every zoom step block for ~1 second), and a plain
   table of 1,000+ rows risks the same kind of first-paint/reflow cost
   for no benefit, since only ~10-15 rows are ever visible at once. */

var FAG_TABLE_ROW_HEIGHT = 30;
var FAG_TABLE_MIN_COL_WIDTH = 48;
var FAG_TABLE_MAX_AUTO_COL_WIDTH = 320;

// Column auto-fit needs real pixel text width, not a per-character
// estimate - a fixed px/char guess (the original approach) is tuned for
// Latin glyphs and badly undercounts full-width CJK text, so a column
// like "第二種住居地域" came out narrower than its own rendered text and
// spilled into the row below. ctx.measureText gives the actual width
// for whatever font is really in effect (same technique label-layer.js
// uses for its own text sizing). Fonts are resolved lazily from the
// live DOM the first time a layer loads, not hardcoded, so a theme's
// custom font_family (main.js::applyTheme) is measured correctly too.
var fagTableMeasureCtx = document.createElement('canvas').getContext('2d');
var fagTableNormalFont = null;
var fagTableBoldFont = null;
function fagTableTextWidth(text, bold) {
  if (!fagTableNormalFont) {
    var cs = getComputedStyle(document.getElementById('feature-table-scroll') || document.body);
    fagTableNormalFont = cs.fontSize + ' ' + cs.fontFamily;
    fagTableBoldFont = '700 ' + cs.fontSize + ' ' + cs.fontFamily;
  }
  fagTableMeasureCtx.font = bold ? fagTableBoldFont : fagTableNormalFont;
  return fagTableMeasureCtx.measureText(text).width;
}

function initFeatureTable(config, map) {
  if (!config.display || !config.display.featureTableEnabled) return;

  var panel = document.getElementById('feature-table-panel');
  var select = document.getElementById('feature-table-layer-select');
  var countEl = document.getElementById('feature-table-count');
  var toggleBtn = document.getElementById('feature-table-toggle');
  var scrollEl = document.getElementById('feature-table-scroll');
  var colsEl = document.getElementById('feature-table-cols');
  var spacerEl = document.getElementById('feature-table-spacer');
  var rowsEl = document.getElementById('feature-table-rows');
  if (!panel || !select || !scrollEl) return;

  // showPopup === false means the layer's own マップ上でのクリック/ホバーが
  // 無効化されている（layer-control.jsのlayerInteractive）ので、一覧表から
  // その行をクリックしても何も起きない = 一覧表に出す意味がない。search.jsも
  // 同じ理由で同じ判定を使っている。
  var tableLayers = (config.layers || []).filter(function (layerConfig) {
    return !!FAG_FEATURES_BY_LAYER[layerConfig.id] && layerConfig.showPopup !== false;
  });
  if (!tableLayers.length) return; // nothing with attributes to list (e.g. tile-only project)

  panel.classList.remove('fag-hidden');

  tableLayers.forEach(function (layerConfig) {
    var opt = document.createElement('option');
    opt.value = layerConfig.id;
    opt.textContent = layerConfig.label;
    select.appendChild(opt);
  });

  var state = {
    layerId: null, columns: [], colWidths: [], rows: [],
    sortColumn: null, sortDirection: 1 // 1 = 昇順, -1 = 降順
  };

  select.addEventListener('change', function () {
    loadLayer(select.value);
  });

  if (toggleBtn) {
    toggleBtn.addEventListener('click', function () {
      panel.classList.toggle('fag-collapsed');
      // #feature-table-scroll has zero height while .fag-collapsed
      // hides it, so any render attempted before now would have laid
      // out ~0 rows - refresh once the real viewport size is back.
      if (!panel.classList.contains('fag-collapsed')) scheduleRowRender();
    });
  }

  var scrollScheduled = false;
  function scheduleRowRender() {
    if (scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(function () {
      scrollScheduled = false;
      renderVisibleRows();
    });
  }
  scrollEl.addEventListener('scroll', scheduleRowRender);
  window.addEventListener('resize', scheduleRowRender);

  loadLayer(tableLayers[0].id);

  function loadLayer(layerId) {
    var byFid = FAG_FEATURES_BY_LAYER[layerId] || {};
    // Object.keys on a plain object with numeric-looking keys is
    // returned in ascending numeric order by the JS spec, which
    // happens to already be _fid (registration) order - sorting
    // again would be redundant, but doing it explicitly here doesn't
    // rely on that spec detail holding for whatever iterates this next.
    var fids = Object.keys(byFid).map(Number).sort(function (a, b) { return a - b; });
    var rows = fids.map(function (fid) { return byFid[fid]; });

    var columns = rows.length
      ? Object.keys(rows[0].feature.properties || {}).filter(function (key) {
        return key !== 'label_text' && key !== '_fid';
      })
      : [];

    state.layerId = layerId;
    state.rows = rows;
    state.columns = columns;
    // Sort criteria don't carry over across a layer switch - each layer
    // has its own column set, so a previously-sorted column name may not
    // even exist on the new layer.
    state.sortColumn = null;
    state.sortDirection = 1;
    // Auto-fit from both the column name AND its longest value (capped
    // at FAG_TABLE_MAX_AUTO_COL_WIDTH - a single outlier value shouldn't
    // blow up the whole column; the user can still drag it wider via
    // the resize handle). Measuring every row's real text width is
    // still cheap at 1,000+ rows (measureText is pure math, no
    // rendering), unlike actually laying out that many rows up front.
    // The header is measured in bold since that's how it actually
    // renders (.fag-table-row-head), and a little extra room over the
    // plain-cell formula so the sort arrow (header only) doesn't crowd
    // the column name.
    state.colWidths = columns.map(function (col) {
      var maxWidth = fagTableTextWidth(col, true);
      for (var i = 0; i < rows.length; i++) {
        var value = (rows[i].feature.properties || {})[col];
        if (value === undefined || value === null) continue;
        var width = fagTableTextWidth(String(value), false);
        if (width > maxWidth) maxWidth = width;
      }
      return Math.min(FAG_TABLE_MAX_AUTO_COL_WIDTH, Math.max(FAG_TABLE_MIN_COL_WIDTH + 42, maxWidth + 34));
    });

    countEl.textContent = rows.length + ' item' + (rows.length === 1 ? '' : 's');
    renderHeader();
    spacerEl.style.height = (rows.length * FAG_TABLE_ROW_HEIGHT) + 'px';
    scrollEl.scrollTop = 0;
    renderVisibleRows();
  }

  // Column header click = sort by that column. Only two states (asc/desc,
  // spec: "昇順・降順のみでよい") - no third "back to original order" click,
  // clicking a different column just starts that column at ascending.
  function sortByColumn(col) {
    if (state.sortColumn === col) {
      state.sortDirection = -state.sortDirection;
    } else {
      state.sortColumn = col;
      state.sortDirection = 1;
    }
    state.rows = state.rows.slice().sort(function (a, b) {
      var aVal = (a.feature.properties || {})[col];
      var bVal = (b.feature.properties || {})[col];
      return state.sortDirection * compareValues(aVal, bVal);
    });
    renderHeader();
    scrollEl.scrollTop = 0;
    renderVisibleRows();
  }

  // Numeric compare when both sides parse as numbers (so 2 sorts before
  // 10, not after it as plain strings would), otherwise locale-aware
  // string compare.
  function compareValues(a, b) {
    var aStr = (a === undefined || a === null) ? '' : String(a);
    var bStr = (b === undefined || b === null) ? '' : String(b);
    var aNum = aStr === '' ? NaN : Number(aStr);
    var bNum = bStr === '' ? NaN : Number(bStr);
    if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
    return aStr.localeCompare(bStr, 'ja');
  }

  function renderHeader() {
    colsEl.innerHTML = '';
    var fragment = document.createDocumentFragment();
    state.columns.forEach(function (col, i) {
      fragment.appendChild(buildHeaderCell(col, state.colWidths[i]));
    });
    colsEl.appendChild(fragment);
  }

  function buildHeaderCell(col, width) {
    var cell = document.createElement('span');
    cell.className = 'fag-table-cell fag-table-cell-head';
    cell.style.width = width + 'px';
    var label = document.createElement('span');
    label.className = 'fag-table-head-label';
    label.textContent = col;
    cell.appendChild(label);
    if (state.sortColumn === col) {
      var arrow = document.createElement('span');
      arrow.className = 'fag-table-sort-arrow';
      arrow.textContent = state.sortDirection === 1 ? '▲' : '▼';
      cell.appendChild(arrow);
    }
    cell.addEventListener('click', function () { sortByColumn(col); });

    var handle = document.createElement('span');
    handle.className = 'fag-table-col-resize';
    handle.addEventListener('mousedown', function (e) { startColumnResize(e, col); });
    handle.addEventListener('click', function (e) { e.stopPropagation(); });
    cell.appendChild(handle);

    return cell;
  }

  // Drag-to-resize (spec feedback: auto-fit still ellipsis-truncates
  // whatever value is longer than FAG_TABLE_MAX_AUTO_COL_WIDTH allows -
  // a manual override covers that outlier without widening every other
  // column to match it). Writes into the same state.colWidths the
  // auto-fit sizing produces, so a manual resize sticks until the next
  // layer switch recomputes widths from scratch.
  function startColumnResize(e, col) {
    e.preventDefault();
    e.stopPropagation();
    var index = state.columns.indexOf(col);
    if (index === -1) return;
    var startX = e.clientX;
    var startWidth = state.colWidths[index];

    function onMove(moveEvent) {
      state.colWidths[index] = Math.max(FAG_TABLE_MIN_COL_WIDTH, startWidth + (moveEvent.clientX - startX));
      renderHeader();
      renderVisibleRows();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function renderVisibleRows() {
    // The sticky header row occupies exactly one row's worth of space
    // ahead of the spacer in normal flow (see style.css - same
    // .fag-table-row height on both) - scrollTop counts that space
    // too, so it has to be subtracted before mapping scroll position
    // to a row index, or the very first bit of scrolling would be
    // mistaken for having scrolled past row 0.
    var headerHeight = FAG_TABLE_ROW_HEIGHT;
    var viewportHeight = Math.max(0, scrollEl.clientHeight - headerHeight);
    var scrollTop = Math.max(0, scrollEl.scrollTop - headerHeight);
    var totalRows = state.rows.length;

    var buffer = 6;
    var startIndex = Math.max(0, Math.floor(scrollTop / FAG_TABLE_ROW_HEIGHT) - buffer);
    var visibleCount = Math.ceil(viewportHeight / FAG_TABLE_ROW_HEIGHT) + buffer * 2;
    var endIndex = Math.min(totalRows, startIndex + visibleCount);

    rowsEl.style.transform = 'translateY(' + (startIndex * FAG_TABLE_ROW_HEIGHT) + 'px)';
    rowsEl.innerHTML = '';
    var fragment = document.createDocumentFragment();
    for (var i = startIndex; i < endIndex; i++) {
      fragment.appendChild(buildRow(state.rows[i]));
    }
    rowsEl.appendChild(fragment);
  }

  function buildRow(entry) {
    var props = entry.feature.properties || {};
    var fid = props._fid;
    var row = document.createElement('div');
    row.className = 'fag-table-row';
    // The map->list half of the spec's two-way selection sync (item 9):
    // rows are recycled by the virtual scroller, so the selected state
    // is re-read from FAG_SELECTION on every build rather than being
    // stored on the element.
    if (typeof fagIsSelected === 'function' && fagIsSelected(state.layerId, fid)) {
      row.className += ' fag-row-selected';
    }
    row.style.height = FAG_TABLE_ROW_HEIGHT + 'px';
    var fragment = document.createDocumentFragment();
    state.columns.forEach(function (col, i) {
      var value = props[col];
      fragment.appendChild(buildCell(
        value === undefined || value === null ? '' : String(value), state.colWidths[i]
      ));
    });
    row.appendChild(fragment);
    row.addEventListener('click', function (event) {
      // The list->map half: Ctrl/Cmd/Shift-click selects without moving
      // the map, so a multi-row selection can be built up by scrolling
      // the list. A plain click keeps its original "zoom to it and open
      // its popup" behavior, and selects it too.
      var additive = event.ctrlKey || event.metaKey || event.shiftKey;
      if (typeof window.fagToggleSelectionFromTable === 'function' && fid !== undefined) {
        window.fagToggleSelectionFromTable(state.layerId, fid, additive);
      }
      if (!additive) focusFeature(map, state.layerId, entry);
    });
    return row;
  }

  // Repaint row highlighting when the selection changes on the map.
  if (typeof fagOnSelectionChange === 'function') {
    fagOnSelectionChange(scheduleRowRender);
  }

  function buildCell(text, width) {
    var cell = document.createElement('span');
    cell.className = 'fag-table-cell';
    cell.style.width = width + 'px';
    cell.textContent = text;
    return cell;
  }
}


/* ---- selection.js ---- */
/* Feature selection + CSV/GeoJSON export (spec item 9). Everything
   here runs entirely in the browser - no server, no external service -
   so it works from a shared folder, a file:// path or SharePoint alike.

   Selection state is {layerId: {fid: true}}. The highlight is drawn as
   a SEPARATE overlay layer rather than by restyling the selected
   feature: style-renderer.js's hover highlight snapshots each layer's
   baseline options and restores them on mouseout, and
   fagUpdateMapUnitWeights rewrites `weight` on every zoom - a
   selection that mutated the same options would be silently undone by
   either of them. An overlay sidesteps both. */
var FAG_SELECTION = {};
var FAG_SELECTION_HIGHLIGHT = null;
var FAG_SELECTION_CHANGE_HOOKS = [];

var FAG_SELECT_COLOR = '#ffd400';
var FAG_SELECT_HALO = '#7a5c00';
// Exporting tens of thousands of rows blocks the main thread for a few
// seconds while the string is built; past this many the user gets a
// chance to back out first.
var FAG_EXPORT_CONFIRM_THRESHOLD = 5000;

function fagSelectionCount() {
  var total = 0;
  Object.keys(FAG_SELECTION).forEach(function (layerId) {
    total += Object.keys(FAG_SELECTION[layerId]).length;
  });
  return total;
}

function fagIsSelected(layerId, fid) {
  return !!(FAG_SELECTION[layerId] && FAG_SELECTION[layerId][fid]);
}

function fagSetSelected(layerId, fid, selected) {
  if (selected) {
    if (!FAG_SELECTION[layerId]) FAG_SELECTION[layerId] = {};
    FAG_SELECTION[layerId][fid] = true;
  } else if (FAG_SELECTION[layerId]) {
    delete FAG_SELECTION[layerId][fid];
    if (!Object.keys(FAG_SELECTION[layerId]).length) delete FAG_SELECTION[layerId];
  }
}

function fagClearSelection() {
  FAG_SELECTION = {};
}

/* Registered by point-list.js so the table can repaint its rows'
   selected state whenever the map's selection changes (the map->list
   half of the spec's "双方向に同期"; the list->map half is the row
   click handler over there). */
function fagOnSelectionChange(hook) {
  FAG_SELECTION_CHANGE_HOOKS.push(hook);
}

function fagSelectionChanged(map) {
  fagRedrawSelectionHighlight(map);
  var countEl = document.getElementById('selection-count');
  if (countEl) {
    var n = fagSelectionCount();
    countEl.textContent = n ? (n + ' selected') : 'None selected';
  }
  FAG_SELECTION_CHANGE_HOOKS.forEach(function (hook) {
    try { hook(); } catch (e) { /* a listener must not break selection */ }
  });
}

function fagRedrawSelectionHighlight(map) {
  if (FAG_SELECTION_HIGHLIGHT) map.removeLayer(FAG_SELECTION_HIGHLIGHT);
  FAG_SELECTION_HIGHLIGHT = L.layerGroup();

  Object.keys(FAG_SELECTION).forEach(function (layerId) {
    var byFid = FAG_FEATURES_BY_LAYER[layerId] || {};
    Object.keys(FAG_SELECTION[layerId]).forEach(function (fid) {
      var entry = byFid[fid];
      if (!entry) return;
      var geometry = entry.feature && entry.feature.geometry;
      if (!geometry) return;
      if (geometry.type === 'Point') {
        var coords = geometry.coordinates;
        // A ring around the marker rather than over it, so the feature's
        // own color stays readable while selected.
        FAG_SELECTION_HIGHLIGHT.addLayer(L.circleMarker([coords[1], coords[0]], {
          radius: 11, color: FAG_SELECT_COLOR, weight: 3, opacity: 1,
          fill: false, interactive: false,
        }));
        FAG_SELECTION_HIGHLIGHT.addLayer(L.circleMarker([coords[1], coords[0]], {
          radius: 13, color: FAG_SELECT_HALO, weight: 1, opacity: 0.9,
          fill: false, interactive: false,
        }));
      } else {
        FAG_SELECTION_HIGHLIGHT.addLayer(L.geoJSON(entry.feature, {
          style: { color: FAG_SELECT_COLOR, weight: 5, opacity: 1, fill: false },
          interactive: false,
        }));
      }
    });
  });

  FAG_SELECTION_HIGHLIGHT.addTo(map);
  // A plain L.layerGroup has no bringToFront of its own - reuse
  // layer-control.js's recursive helper, which walks down to the actual
  // Path children. These are all interactive:false, so moving them to
  // the end of the canvas draw order puts the highlight on top without
  // disturbing the click-priority order that helper set up at load.
  bringLayerToFront(FAG_SELECTION_HIGHLIGHT);
}

/* ------------------------------------------------------------------
   Value formatting shared by both export formats.
   ------------------------------------------------------------------ */

/* Attribute keys to export, in the GeoJSON's own property order (which
   core/geojson_writer.py already wrote in the user's chosen field
   order). The plugin's synthetic attributes are excluded, matching the
   popup. */
function fagExportFields(rows) {
  var seen = {};
  var fields = [];
  rows.forEach(function (entry) {
    Object.keys(entry.feature.properties || {}).forEach(function (key) {
      if (key === '_fid' || key === 'label_text' || seen[key]) return;
      seen[key] = true;
      fields.push(key);
    });
  });
  return fields;
}

/* A representative lat/lng for a row - the spec requires coordinate
   columns in the CSV, using the centroid for lines and polygons.
   Reuses style-renderer.js's fagFeatureLatLng so a CSV coordinate and
   the popup's Google Maps link can never disagree. */
function fagExportLatLng(entry) {
  var geometry = entry.feature && entry.feature.geometry;
  if (geometry && geometry.type === 'Point') {
    return { lat: geometry.coordinates[1], lng: geometry.coordinates[0] };
  }
  return fagFeatureLatLng(entry.layer);
}

function fagCsvCell(value, forceText) {
  if (value === null || value === undefined) return '';
  var text = String(value);
  if (forceText && /^0\d/.test(text)) {
    // Excel strips the leading zero from a facility/ward code like
    // "0123" unless it's handed a formula-quoted literal.
    text = '="' + text.replace(/"/g, '""') + '"';
  }
  if (/[",\r\n]/.test(text)) {
    return '"' + text.replace(/"/g, '""') + '"';
  }
  return text;
}

function fagBuildCsv(rows, aliases, options) {
  options = options || {};
  var fields = fagExportFields(rows);
  var header = fields.map(function (name) {
    return fagCsvCell(aliases[name] || name, false);
  });
  header.push('latitude', 'longitude');

  var lines = [header.join(',')];
  rows.forEach(function (entry) {
    var props = entry.feature.properties || {};
    var cells = fields.map(function (name) {
      return fagCsvCell(props[name], options.forceTextCodes);
    });
    var latlng = fagExportLatLng(entry);
    cells.push(latlng ? latlng.lat.toFixed(6) : '');
    cells.push(latlng ? latlng.lng.toFixed(6) : '');
    lines.push(cells.join(','));
  });
  // CRLF: Excel is the overwhelmingly common consumer here and is
  // happiest with it, and every other tool accepts it.
  return lines.join('\r\n') + '\r\n';
}

function fagBuildGeoJson(rows, indent) {
  var features = rows.map(function (entry) {
    var props = {};
    Object.keys(entry.feature.properties || {}).forEach(function (key) {
      if (key === '_fid' || key === 'label_text') return;
      props[key] = entry.feature.properties[key];
    });
    return { type: 'Feature', properties: props, geometry: entry.feature.geometry };
  });
  // No "crs" member: the data is already WGS84, which RFC 7946 makes
  // the assumed and only CRS - emitting one is deprecated.
  var collection = { type: 'FeatureCollection', features: features };
  return JSON.stringify(collection, null, indent ? 2 : 0);
}

/* ------------------------------------------------------------------
   Download
   ------------------------------------------------------------------ */

function fagTimestamp() {
  var now = new Date();
  function pad(value) { return (value < 10 ? '0' : '') + value; }
  return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
    '_' + pad(now.getHours()) + pad(now.getMinutes());
}

function fagDownload(filename, text, mime, addBom) {
  // The BOM is what stops Excel from rendering a UTF-8 CSV of Japanese
  // text as mojibake - by far the most common complaint about
  // browser-generated CSVs, so it is on for every CSV export.
  var parts = addBom ? ['﻿', text] : [text];
  var blob = new Blob(parts, { type: mime });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  // Revoking immediately can cancel the download in some browsers.
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function fagSafeFilename(name) {
  return String(name || 'layer').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
}

/* ------------------------------------------------------------------
   Wiring
   ------------------------------------------------------------------ */

function initSelection(config, map) {
  var settings = (config.display && config.display.selection) || null;
  if (!settings) return;
  var bar = document.getElementById('selection-bar');
  if (!bar) return;

  var layersById = {};
  (config.layers || []).forEach(function (layerConfig) {
    layersById[layerConfig.id] = layerConfig;
  });

  // Only layers whose features were registered can be selected or
  // exported - the same set the feature table and search cover.
  function selectableLayerIds() {
    return Object.keys(FAG_FEATURES_BY_LAYER).filter(function (layerId) {
      var layerConfig = layersById[layerId];
      return layerConfig && layerConfig.showPopup !== false;
    });
  }

  function activeLayerId() {
    var select = document.getElementById('feature-table-layer-select');
    if (select && select.value) return select.value;
    return selectableLayerIds()[0];
  }

  function rowsFor(layerId, selectedOnly) {
    var byFid = FAG_FEATURES_BY_LAYER[layerId] || {};
    return Object.keys(byFid)
      .map(Number)
      .sort(function (a, b) { return a - b; })
      .filter(function (fid) { return !selectedOnly || fagIsSelected(layerId, fid); })
      .map(function (fid) { return byFid[fid]; });
  }

  function selectedRowsAllLayers() {
    var result = [];
    selectableLayerIds().forEach(function (layerId) {
      rowsFor(layerId, true).forEach(function (entry) {
        result.push({ layerId: layerId, entry: entry });
      });
    });
    return result;
  }

  bar.classList.remove('fag-hidden');

  // --- click selection ---------------------------------------------
  // Clicking a feature fires that layer's 'click' AND then the map's
  // own 'click' for the same physical click (layer first). Without
  // this, the map handler below would clear the selection the feature
  // handler just made. Comparing the underlying DOM event identifies
  // "same click" exactly, with no timer or flag left in a stale state
  // when propagation is stopped and no map click ever arrives.
  var lastFeatureClickEvent = null;

  // Bound per feature rather than via a map-level hit test so it uses
  // exactly the same hit target (and therefore the same click priority)
  // that popups already resolve through.
  selectableLayerIds().forEach(function (layerId) {
    var byFid = FAG_FEATURES_BY_LAYER[layerId];
    Object.keys(byFid).forEach(function (fid) {
      var entry = byFid[fid];
      if (!entry.layer || !entry.layer.on) return;
      entry.layer.on('click', function (event) {
        lastFeatureClickEvent = event.originalEvent || null;
        var additive = event.originalEvent &&
          (event.originalEvent.ctrlKey || event.originalEvent.metaKey ||
           event.originalEvent.shiftKey);
        if (additive) {
          // Ctrl/Cmd-click builds a multi-feature selection, and must
          // not also pop up a popup for each one.
          L.DomEvent.stopPropagation(event);
          if (entry.layer.closePopup) entry.layer.closePopup();
          fagSetSelected(layerId, fid, !fagIsSelected(layerId, fid));
        } else {
          fagClearSelection();
          fagSetSelected(layerId, fid, true);
        }
        fagSelectionChanged(map);
      });
    });
  });

  // Clicking empty map clears, matching how selection works basically
  // everywhere else - but not when this same click was already handled
  // by a feature above.
  map.on('click', function (event) {
    if (event.originalEvent && event.originalEvent === lastFeatureClickEvent) return;
    if (!fagSelectionCount()) return;
    fagClearSelection();
    fagSelectionChanged(map);
  });

  // --- rectangle selection -----------------------------------------
  var rectButton = document.getElementById('selection-rect-btn');
  var rectMode = false;
  var dragStart = null;
  var rubberBand = null;

  function setRectMode(on) {
    rectMode = on;
    rectButton.classList.toggle('fag-active', on);
    map.getContainer().style.cursor = on ? 'crosshair' : '';
    if (on) {
      map.dragging.disable();
      map.boxZoom.disable();
    } else {
      map.dragging.enable();
      map.boxZoom.enable();
    }
  }

  rectButton.addEventListener('click', function () { setRectMode(!rectMode); });

  map.on('mousedown', function (event) {
    if (!rectMode) return;
    dragStart = event.latlng;
    rubberBand = L.rectangle(L.latLngBounds(dragStart, dragStart), {
      color: FAG_SELECT_COLOR, weight: 2, dashArray: '5,4', fill: true,
      fillOpacity: 0.1, interactive: false,
    }).addTo(map);
  });

  map.on('mousemove', function (event) {
    if (!rectMode || !dragStart || !rubberBand) return;
    rubberBand.setBounds(L.latLngBounds(dragStart, event.latlng));
  });

  map.on('mouseup', function (event) {
    if (!rectMode || !dragStart) return;
    var bounds = L.latLngBounds(dragStart, event.latlng);
    if (rubberBand) { map.removeLayer(rubberBand); rubberBand = null; }
    dragStart = null;
    setRectMode(false);

    fagClearSelection();
    selectableLayerIds().forEach(function (layerId) {
      var byFid = FAG_FEATURES_BY_LAYER[layerId];
      Object.keys(byFid).forEach(function (fid) {
        var entry = byFid[fid];
        // Only what's actually on the map right now - a layer toggled
        // off in the panel isn't something the user can see to select.
        if (!map.hasLayer(entry.layer) && !(entry.layer._map)) return;
        var geometry = entry.feature.geometry;
        if (!geometry) return;
        var hit;
        if (geometry.type === 'Point') {
          hit = bounds.contains(L.latLng(geometry.coordinates[1], geometry.coordinates[0]));
        } else if (entry.layer.getBounds) {
          // Bounding-box intersection, which is what the spec asks for
          // ("面・線は矩形と交差で判定") - a true geometry intersection
          // would need a polygon-clipping library.
          hit = bounds.intersects(entry.layer.getBounds());
        }
        if (hit) fagSetSelected(layerId, fid, true);
      });
    });
    fagSelectionChanged(map);
  });

  // --- export buttons ----------------------------------------------
  function confirmLargeExport(count) {
    if (count <= FAG_EXPORT_CONFIRM_THRESHOLD) return true;
    return window.confirm(
      count + ' features will be exported. This may freeze the page for a few ' +
      'seconds. Continue?'
    );
  }

  function aliasesFor(layerId) {
    return (layersById[layerId] && layersById[layerId].fieldAliases) || {};
  }

  function labelFor(layerId) {
    return (layersById[layerId] && layersById[layerId].label) || layerId;
  }

  function exportCsv(selectedOnly) {
    var stamp = fagTimestamp();
    if (selectedOnly) {
      // A selection can span layers, and their columns differ - one
      // file per layer keeps each CSV's header meaningful rather than
      // producing a union of every layer's fields with mostly blanks.
      var byLayer = {};
      selectedRowsAllLayers().forEach(function (item) {
        (byLayer[item.layerId] = byLayer[item.layerId] || []).push(item.entry);
      });
      var layerIds = Object.keys(byLayer);
      if (!layerIds.length) { window.alert('Nothing is selected.'); return; }
      if (!confirmLargeExport(fagSelectionCount())) return;
      layerIds.forEach(function (layerId) {
        var csv = fagBuildCsv(byLayer[layerId], aliasesFor(layerId),
          { forceTextCodes: settings.forceTextCodes });
        fagDownload(fagSafeFilename(labelFor(layerId)) + '_selected_' + stamp + '.csv',
          csv, 'text/csv;charset=utf-8;', true);
      });
      return;
    }
    var layerId = activeLayerId();
    if (!layerId) return;
    var rows = rowsFor(layerId, false);
    if (!confirmLargeExport(rows.length)) return;
    fagDownload(fagSafeFilename(labelFor(layerId)) + '_' + stamp + '.csv',
      fagBuildCsv(rows, aliasesFor(layerId), { forceTextCodes: settings.forceTextCodes }),
      'text/csv;charset=utf-8;', true);
  }

  function exportGeoJson(selectedOnly) {
    var stamp = fagTimestamp();
    var rows;
    var name;
    if (selectedOnly) {
      rows = selectedRowsAllLayers().map(function (item) { return item.entry; });
      if (!rows.length) { window.alert('Nothing is selected.'); return; }
      name = 'selected_' + stamp;
    } else {
      var layerId = activeLayerId();
      if (!layerId) return;
      rows = rowsFor(layerId, false);
      name = fagSafeFilename(labelFor(layerId)) + '_' + stamp;
    }
    if (!confirmLargeExport(rows.length)) return;
    fagDownload(name + '.geojson', fagBuildGeoJson(rows, settings.prettyGeoJson),
      'application/geo+json', false);
  }

  document.getElementById('export-csv-selected')
    .addEventListener('click', function () { exportCsv(true); });
  document.getElementById('export-csv-all')
    .addEventListener('click', function () { exportCsv(false); });
  document.getElementById('export-geojson-selected')
    .addEventListener('click', function () { exportGeoJson(true); });
  document.getElementById('export-geojson-all')
    .addEventListener('click', function () { exportGeoJson(false); });

  var clearBtn = document.getElementById('selection-clear-btn');
  if (clearBtn) {
    clearBtn.addEventListener('click', function () {
      fagClearSelection();
      fagSelectionChanged(map);
    });
  }

  // point-list.js needs a way to push a row click back into the map's
  // selection; exposing it here keeps that module free of selection
  // bookkeeping.
  window.fagToggleSelectionFromTable = function (layerId, fid, additive) {
    if (!additive) fagClearSelection();
    fagSetSelected(layerId, fid, additive ? !fagIsSelected(layerId, fid) : true);
    fagSelectionChanged(map);
  };

  fagSelectionChanged(map);
}


/* ---- main.js ---- */
/* Entry point: wires the modules above together once config/layersData/
   layersStyleData have been loaded (either inlined or via <script
   src>, spec 5.3). Every layer the user added is shown with its own
   QGIS symbology (qgis2web-style "show everything" model). */
var FAG = {
  map: null,
  config: null,
  layersData: null,
  layersStyleData: null,
};

/* Overrides the CSS custom properties style.css defines for the
   header (--header-bg/--header-text/--font-family), when the user
   picked a title/header color or font on the 出力設定 tab. Left
   unset (null/undefined) falls through to style.css's own defaults,
   so an unconfigured install looks exactly as before. */
function applyTheme(theme) {
  if (!theme) return;
  var root = document.documentElement;
  if (theme.headerBgColor) root.style.setProperty('--header-bg', theme.headerBgColor);
  if (theme.titleColor) root.style.setProperty('--header-text', theme.titleColor);
  if (theme.fontFamily) {
    root.style.setProperty(
      '--font-family',
      '"' + theme.fontFamily + '", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif'
    );
  }
}

(function () {
  FAG.config = config;
  FAG.layersData = layersData;
  FAG.layersStyleData = layersStyleData;

  document.title = config.meta.title;
  document.getElementById('app-title').textContent = config.meta.title;
  applyTheme(config.theme);

  FAG.map = initMap(config);
  applyDisplaySettings(FAG.map, layersData, config.display);
  // initLayerControl now builds one layer per event-loop turn so the
  // loading counter can paint (spec item 8), so everything that depends
  // on the registries it fills goes in the completion callback rather
  // than on the following line: FAG_LABEL_REGISTRY for the label layer,
  // FAG_FEATURES_BY_LAYER for search and the feature table. Each of
  // these still no-ops on its own if config.display disabled it.
  initLayerControl(FAG.map, config.layers, layersData, layersStyleData, config.display, function () {
    initLabelLayer(FAG.map);
    initLabelClickPopup(FAG.map);
    initSearch(config, FAG.map);
    initFeatureTable(config, FAG.map);
    initSelection(config, FAG.map);

    // Panels/CSS can change the map container size after Leaflet measured it once.
    setTimeout(function () { FAG.map.invalidateSize(); }, 150);
  });
})();

</script>
</body>
</html>
